<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Name Attestations</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>

  <style>
    :root {
      --sidebar-w: 380px;
      --accent: #c0392b;
      --bg: #ffffff;
      --bg2: #f8f9fa;
      --border: #dee2e6;
      --text: #2c3e50;
      --text2: #6c757d;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }

    #layout { display: flex; height: 100vh; }
    #map { flex: 1; }

    /* ── Stats bar ─────────────────────────────────────── */
    #stats {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.92); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 14px; font-size: 0.8rem;
      color: var(--text2); z-index: 1000; pointer-events: none;
      white-space: nowrap;
    }

    /* ── Sidebar ───────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w); height: 100%; background: var(--bg);
      border-left: 1px solid var(--border); display: flex; flex-direction: column;
      z-index: 1001; box-shadow: -2px 0 10px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    #sidebar[hidden] { display: none; }

    .sb-header {
      padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
      background: var(--bg2); flex-shrink: 0;
    }
    .sb-header h2 { margin: 0 0 2px; font-size: 1rem; color: var(--text); }
    .sb-header .findspot { font-size: 0.8rem; color: var(--text2); margin: 0; }
    .sb-close {
      float: right; background: none; border: none; font-size: 1.3rem;
      cursor: pointer; color: var(--text2); line-height: 1; padding: 0;
    }
    .sb-close:hover { color: var(--text); }

    .sb-body { flex: 1; overflow-y: auto; padding: 14px 16px; }

    .date-range { font-size: 0.8rem; color: var(--text2); margin: 0 0 12px; }

    .person-card {
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 10px; background: var(--bg2);
    }
    .person-name { font-weight: 600; font-size: 0.95rem; color: var(--text); margin: 0 0 4px; }
    .person-meta { font-size: 0.8rem; color: var(--text2); margin: 0; }
    .badge {
      display: inline-block; font-size: 0.7rem; padding: 1px 6px;
      border-radius: 10px; margin-left: 4px; vertical-align: middle;
    }
    .badge-deity    { background: #ffeaa7; color: #6c5a00; }
    .badge-imperial { background: #dfe6e9; color: #2d3436; }
    .badge-fragment { background: #fdcece; color: #6c0000; }

    details { margin-bottom: 12px; }
    details summary { font-size: 0.82rem; color: var(--text2); cursor: pointer; }
    details pre {
      margin: 6px 0 0; font-size: 0.75rem; white-space: pre-wrap;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; padding: 8px; max-height: 160px; overflow-y: auto;
    }

    .sb-footer {
      padding: 10px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; background: var(--bg2);
    }
    .sb-footer a { font-size: 0.82rem; color: var(--accent); text-decoration: none; }
    .sb-footer a:hover { text-decoration: underline; }
    .flag-link { font-size: 0.78rem; color: var(--text2); cursor: pointer; background: none; border: none; padding: 0; }
    .flag-link:hover { color: var(--accent); text-decoration: underline; }

    /* ── Flag modal ────────────────────────────────────── */
    #modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000;
    }
    #modal-backdrop[hidden] { display: none; }
    .modal-box {
      background: var(--bg); border-radius: 8px; padding: 24px;
      width: 360px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .modal-box h3 { margin: 0 0 16px; font-size: 1rem; color: var(--text); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.82rem; color: var(--text2); margin-bottom: 4px; }
    .field select, .field textarea, .field input[type="email"] {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 5px; font-size: 0.9rem; font-family: inherit;
    }
    .field textarea { resize: vertical; min-height: 72px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
    .btn-primary {
      background: var(--accent); color: white; border: none;
      padding: 8px 18px; border-radius: 5px; cursor: pointer; font-size: 0.9rem;
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-cancel {
      background: none; border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 5px; cursor: pointer; font-size: 0.9rem;
      color: var(--text2);
    }
    .success-msg { text-align: center; color: #27ae60; padding: 10px 0; font-size: 0.9rem; }
    .error-msg { text-align: center; color: #c0392b; padding: 10px 0; font-size: 0.9rem; }
  </style>
</head>

<body>
<div id="layout">
  <div id="map"></div>

  <div id="stats">Loading…</div>

  <!-- Sidebar -->
  <div id="sidebar" hidden>
    <div class="sb-header">
      <button class="sb-close" onclick="closeDetail()" title="Close">&#x2715;</button>
      <h2 id="sb-title">—</h2>
      <p class="findspot" id="sb-findspot"></p>
    </div>
    <div class="sb-body" id="sb-body"></div>
    <div class="sb-footer">
      <a id="sb-edcs-link" href="#" target="_blank" rel="noopener">View on EDCS ↗</a>
      <button class="flag-link" onclick="openFlagModal()">Flag this entry</button>
    </div>
  </div>
</div>

<!-- Flag modal -->
<div id="modal-backdrop" hidden onclick="handleBackdropClick(event)">
  <div class="modal-box">
    <h3>Flag this entry</h3>
    <div id="modal-body">
      <div class="field">
        <label for="flag-category">Category</label>
        <select id="flag-category">
          <option value="people">People / name extraction</option>
          <option value="translation">Translation</option>
          <option value="summary">Summary</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="flag-comment">Comment</label>
        <textarea id="flag-comment" placeholder="Describe the issue…"></textarea>
      </div>
      <div class="field">
        <label for="flag-email">Your email (optional — only if you want a reply)</label>
        <input type="email" id="flag-email" placeholder="you@example.com">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeFlagModal()">Cancel</button>
        <button class="btn-primary" id="flag-submit-btn" onclick="submitFlag()">Submit</button>
      </div>
    </div>
    <div id="modal-error" class="error-msg" hidden>
      Something went wrong — please try again.
    </div>
    <div id="modal-success" class="success-msg" hidden>
      Thank you — flag recorded.
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<script>
// ── State ───────────────────────────────────────────────
let currentEdcsId = null;
let map, clusterLayer, provinceLayer;
let loadTimer;

// ── Helpers ─────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function makeBadge(cls, text) {
  const b = document.createElement('span');
  b.className = `badge ${cls}`;
  b.textContent = text;
  return b;
}

// ── Map init ────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([41.9, 12.5], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 18,
  }).addTo(map);

  clusterLayer = L.markerClusterGroup({ chunkedLoading: true });
  provinceLayer = L.layerGroup();
  map.addLayer(clusterLayer);
  map.addLayer(provinceLayer);

  map.on('moveend zoomend', () => {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(loadMarkers, 300);
  });

  // Clicking map background (not a marker) clears selection
  map.on('click', () => clearDetail());

  loadMarkers();
}

// ── Marker loading ──────────────────────────────────────
async function loadMarkers() {
  const b = map.getBounds();
  const bbox = `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
  const zoom = map.getZoom();

  let data;
  try {
    const resp = await fetch(`/api/markers?bbox=${bbox}&zoom=${zoom}`);
    if (!resp.ok) return;
    data = await resp.json();
  } catch (_) { return; }

  clusterLayer.clearLayers();
  provinceLayer.clearLayers();

  const features = data.features || [];
  document.getElementById('stats').textContent =
    zoom < 6
      ? `${features.length} province${features.length !== 1 ? 's' : ''} in view`
      : `${features.length} inscription${features.length !== 1 ? 's' : ''} in view`;

  for (const f of features) {
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties;

    if (p.type === 'province_cluster') {
      const marker = L.circleMarker([lat, lon], {
        radius: 14, fillColor: '#e67e22', color: '#fff', weight: 2, fillOpacity: 0.85,
      });
      marker.bindTooltip(`<b>${escHtml(p.province.replace(/_/g, ' '))}</b><br>${escHtml(p.count)} inscriptions`);
      marker.on('click', (e) => L.DomEvent.stopPropagation(e));
      provinceLayer.addLayer(marker);
    } else {
      const persons = p.persons || [];
      const color = markerColor(persons);
      const marker = L.circleMarker([lat, lon], {
        radius: 7, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.85,
      });
      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        selectInscription(p.edcs_id);
      });
      clusterLayer.addLayer(marker);
    }
  }
}

function markerColor(persons) {
  if (!persons.length) return '#95a5a6';
  const genders = [...new Set(persons.map(p => p.gender).filter(Boolean))];
  if (genders.length > 1) return '#9b59b6';
  if (genders[0] === 'male')   return '#3498db';
  if (genders[0] === 'female') return '#e91e63';
  return '#95a5a6';
}

// ── Selection / deep links ──────────────────────────────
function selectInscription(edcsId) {
  location.hash = '#edcs_id=' + encodeURIComponent(edcsId);
}

function clearDetail() {
  if (location.hash) location.hash = '';
  hideSidebar();
}

function closeDetail() {
  location.hash = '';
  hideSidebar();
}

window.addEventListener('hashchange', onHashChange);

async function onHashChange() {
  const match = location.hash.match(/^#edcs_id=(.+)$/);
  if (!match) { hideSidebar(); return; }
  const edcsId = decodeURIComponent(match[1]);
  if (edcsId === currentEdcsId) return;
  await loadInscription(edcsId);
}

async function loadInscription(edcsId) {
  let data;
  try {
    const resp = await fetch(`/api/inscription/${encodeURIComponent(edcsId)}`);
    if (!resp.ok) { hideSidebar(); return; }
    data = await resp.json();
  } catch (_) { hideSidebar(); return; }

  currentEdcsId = edcsId;
  renderSidebar(data);
}

// ── Sidebar rendering ───────────────────────────────────
function renderSidebar(data) {
  const persons = data.persons || [];
  const firstName = persons[0];
  const displayName = firstName
    ? [firstName.praenomen, firstName.nomen, firstName.cognomen].filter(Boolean).join(' ') || firstName.raw_name || data.edcs_id
    : data.edcs_id;

  document.getElementById('sb-title').textContent = displayName;
  document.getElementById('sb-findspot').textContent = data.findspot || '';
  document.getElementById('sb-edcs-link').href = data.edcs_url;

  const body = document.getElementById('sb-body');
  body.innerHTML = '';

  if (data.date_from != null || data.date_to != null) {
    const p = document.createElement('p');
    p.className = 'date-range';
    const from = data.date_from != null ? (data.date_from < 0 ? `${Math.abs(data.date_from)} BCE` : `${data.date_from} CE`) : '?';
    const to   = data.date_to   != null ? (data.date_to   < 0 ? `${Math.abs(data.date_to)} BCE`   : `${data.date_to} CE`)   : '?';
    p.textContent = `Date: ${from} – ${to}`;
    body.appendChild(p);
  }

  for (const person of persons) {
    const card = document.createElement('div');
    card.className = 'person-card';

    const nameParts = [person.praenomen, person.nomen, person.cognomen].filter(Boolean);
    const nameEl = document.createElement('p');
    nameEl.className = 'person-name';
    nameEl.textContent = nameParts.join(' ') || person.raw_name || '(unnamed)';

    if (person.is_deity)    nameEl.appendChild(makeBadge('badge-deity',    'deity'));
    if (person.is_imperial) nameEl.appendChild(makeBadge('badge-imperial', 'imperial'));
    if (person.fragmentary) nameEl.appendChild(makeBadge('badge-fragment', 'fragmentary'));

    const meta = [];
    if (person.gender)  meta.push(`Gender: ${person.gender}`);
    if (person.status)  meta.push(`Status: ${person.status}`);
    if (person.cluster_id != null) {
      const conf = person.cluster_confidence ? ` (${person.cluster_confidence})` : '';
      meta.push(`Cluster #${person.cluster_id} — ${person.cluster_size} attestation${person.cluster_size !== 1 ? 's' : ''}${conf}`);
    }

    const metaEl = document.createElement('p');
    metaEl.className = 'person-meta';
    metaEl.textContent = meta.join(' · ');

    card.appendChild(nameEl);
    if (meta.length) card.appendChild(metaEl);
    body.appendChild(card);
  }

  if (data.raw_text) {
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'Raw inscription text';
    const pre = document.createElement('pre');
    pre.textContent = data.raw_text;
    details.appendChild(summary);
    details.appendChild(pre);
    body.appendChild(details);
  }

  showSidebar();
}

function showSidebar() { document.getElementById('sidebar').removeAttribute('hidden'); }
function hideSidebar()  { document.getElementById('sidebar').setAttribute('hidden', ''); currentEdcsId = null; }

// ── Flag modal ──────────────────────────────────────────
function openFlagModal() {
  document.getElementById('flag-category').value = 'people';
  document.getElementById('flag-comment').value  = '';
  document.getElementById('flag-email').value    = '';
  document.getElementById('modal-body').removeAttribute('hidden');
  document.getElementById('modal-error').setAttribute('hidden', '');
  document.getElementById('modal-success').setAttribute('hidden', '');
  document.getElementById('modal-backdrop').removeAttribute('hidden');
}

function closeFlagModal() {
  document.getElementById('modal-backdrop').setAttribute('hidden', '');
}

function handleBackdropClick(e) {
  if (e.target === document.getElementById('modal-backdrop')) closeFlagModal();
}

async function submitFlag() {
  const btn = document.getElementById('flag-submit-btn');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/flags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        edcs_id:  currentEdcsId,
        category: document.getElementById('flag-category').value,
        comment:  document.getElementById('flag-comment').value  || null,
        email:    document.getElementById('flag-email').value    || null,
      }),
    });
    if (resp.ok) {
      document.getElementById('modal-body').setAttribute('hidden', '');
      document.getElementById('modal-success').removeAttribute('hidden');
      setTimeout(closeFlagModal, 2000);
    } else {
      document.getElementById('modal-error').removeAttribute('hidden');
    }
  } finally {
    btn.disabled = false;
  }
}

// ── Boot ────────────────────────────────────────────────
initMap();
if (location.hash) onHashChange();
</script>
</body>
</html>
